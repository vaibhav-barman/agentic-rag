<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Glossa answers from your own documents and shows where each answer came from." />
    <title>Glossa</title>
    <script>
      // Follow the system colour scheme before first paint (no flash).
      try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)')
        var apply = function () { document.documentElement.classList.toggle('dark', mq.matches) }
        apply()
        mq.addEventListener('change', apply)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
