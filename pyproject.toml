[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vaibhav", email = "vaibhavbarman2609@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
agentic-rag = "agentic_rag:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
include = ["backend"]
exclude = ["**/venv", "**/__pycache__"]
venvPath = "backend"
venv = "venv"
extraPaths = ["backend"]
pythonVersion = "3.14"

[tool.ruff]
src = ["backend"]
line-length = 100
target-version = "py314"
extend-exclude = ["backend/venv", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/File() in argument defaults is the idiomatic pattern.
"backend/app/**/*.py" = ["B008"]
"backend/tests/**/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
